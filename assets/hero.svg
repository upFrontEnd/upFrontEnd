<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">Adel Kamel — Front-end developer</title>
  <desc id="d">Graphic designer turned front-end developer, based in Paris. Animated panels show a design canvas, a code editor and a flight-sim overlay.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1b1c"/>
      <stop offset="1" stop-color="#2b2b2b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d19e1d"/>
      <stop offset=".5" stop-color="#ffd86e"/>
      <stop offset="1" stop-color="#e3a812"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3a812" stop-opacity=".18"/>
      <stop offset=".6" stop-color="#2a2829" stop-opacity=".96"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <style>
      text { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: Consolas, 'SFMono-Regular', Menlo, monospace; }
      .fade { opacity: 0; animation: fade .8s ease forwards; }
      .d1 { animation-delay: .2s } .d2 { animation-delay: .5s } .d3 { animation-delay: .8s }
      .d4 { animation-delay: 1.1s } .d5 { animation-delay: 1.4s } .d6 { animation-delay: 1.7s }
      /* Opacité seulement : un transform CSS écraserait les translate() des groupes */
      @keyframes fade { from { opacity: 0 } to { opacity: 1 } }

      .line { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 6s ease-in-out infinite; }
      .l2 { animation-delay: .4s } .l3 { animation-delay: .8s } .l4 { animation-delay: 1.2s } .l5 { animation-delay: 1.6s }
      @keyframes grow { 0% { transform: scaleX(0) } 20%, 85% { transform: scaleX(1) } 100% { transform: scaleX(0) } }

      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }

      .shape { transform-box: fill-box; transform-origin: center; animation: pop 6s ease-in-out infinite; }
      .s2 { animation-delay: .6s } .s3 { animation-delay: 1.2s }
      @keyframes pop { 0%, 100% { transform: scale(.85); opacity: .6 } 50% { transform: scale(1); opacity: 1 } }

      .plane { animation: fly 9s linear infinite; }
      @keyframes fly { from { transform: translateX(-80px) } to { transform: translateX(1280px) } }

      .dot { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .35 } }

      @media (prefers-reduced-motion: reduce) {
        .fade, .line, .shape, .plane, .cursor, .dot { animation: none !important; opacity: 1 !important; }
        .line { transform: none !important; }
      }
    </style>
  </defs>

  <rect width="1200" height="380" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="18" fill="url(#grid)"/>

  <!-- Avion qui traverse le ciel -->
  <g class="plane" opacity=".5">
    <g transform="translate(0 52) scale(.45)"><g fill="#ffd86e" opacity="1">
      <rect x="-60" y="-6" width="124" height="12" rx="6"/>
      <path d="M12 -5 L-14 -48 H-26 L-12 -5 Z M12 5 L-14 48 H-26 L-12 5 Z"/>
      <path d="M-46 -5 L-58 -22 H-66 L-58 -5 Z M-46 5 L-58 22 H-66 L-58 5 Z"/>
    </g></g>
    <path d="M-160 52 H-34" stroke="#ffd86e" stroke-opacity=".35" stroke-dasharray="6 8" stroke-width="2"/>
  </g>

  <!-- Titre -->
  <g transform="translate(64 0)">
    <text class="fade d1" x="0" y="120" fill="#c3d0d9" font-size="20" letter-spacing="4">HELLO, I'M</text>
    <text class="fade d2" x="0" y="182" fill="#ffffff" font-size="62" font-weight="700">Adel Kamel</text>
    <rect class="fade d3" x="0" y="200" width="120" height="4" rx="2" fill="url(#gold)"/>
    <text class="fade d3" x="0" y="242" fill="#ffffff" font-size="24" font-weight="600">Graphic designer turned front-end developer</text>
    <text class="fade d4" x="0" y="276" fill="#c3d0d9" font-size="18">Interfaces where design and code fly together.</text>
    <g class="fade d5">
      <circle class="dot" cx="8" cy="318" r="6" fill="#3fb950"/>
      <text x="24" y="324" fill="#c3d0d9" font-size="16">Paris, France · Vue · SCSS · JavaScript · Flight sim streaming</text>
    </g>
  </g>

  <!-- Panneau design -->
  <g class="fade d4" transform="translate(690 56)">
    <rect width="220" height="150" rx="12" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".14"/>
    <rect x="0" y="0" width="4" height="150" rx="2" fill="#e3a812"/>
    <text x="18" y="28" fill="#f57c20" font-size="11" font-weight="700" letter-spacing="2">DESIGN</text>
    <circle class="shape" cx="56" cy="88" r="26" fill="#e3a812" opacity=".85"/>
    <rect class="shape s2" x="96" y="60" width="52" height="52" rx="8" fill="#f57c20" opacity=".8"/>
    <path class="shape s3" d="M186 112 l-22 0 l11 -40 z" fill="#ffd86e" opacity=".8"/>
    <rect x="18" y="128" width="184" height="6" rx="3" fill="#ffffff" fill-opacity=".08"/>
  </g>

  <!-- Panneau code -->
  <g class="fade d5" transform="translate(930 56)">
    <rect width="220" height="150" rx="12" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".14"/>
    <rect x="0" y="0" width="4" height="150" rx="2" fill="#e3a812"/>
    <text x="18" y="28" fill="#f57c20" font-size="11" font-weight="700" letter-spacing="2">CODE</text>
    <rect class="line" x="18" y="46" width="120" height="8" rx="4" fill="#ffd86e"/>
    <rect class="line l2" x="34" y="66" width="150" height="8" rx="4" fill="#c3d0d9" fill-opacity=".7"/>
    <rect class="line l3" x="34" y="86" width="96" height="8" rx="4" fill="#f57c20" fill-opacity=".8"/>
    <rect class="line l4" x="34" y="106" width="130" height="8" rx="4" fill="#c3d0d9" fill-opacity=".7"/>
    <rect class="line l5" x="18" y="126" width="60" height="8" rx="4" fill="#ffd86e"/>
    <rect class="cursor" x="84" y="124" width="3" height="12" fill="#ffffff"/>
  </g>

  <!-- Panneau cockpit / overlay -->
  <g class="fade d6" transform="translate(690 222)">
    <rect width="460" height="100" rx="12" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".14"/>
    <rect x="0" y="0" width="4" height="100" rx="2" fill="#e3a812"/>
    <text x="18" y="28" fill="#f57c20" font-size="11" font-weight="700" letter-spacing="2">STREAM OVERLAY</text>
    <text class="mono" x="18" y="58" fill="#ffffff" font-size="16">LFPG → KJFK</text>
    <text class="mono" x="18" y="82" fill="#c3d0d9" font-size="13">FL370 · M.82 · ETA 14:05Z</text>
    <rect x="232" y="50" width="96" height="6" rx="3" fill="#ffffff" fill-opacity=".1"/>
    <rect class="line" x="232" y="50" width="96" height="6" rx="3" fill="url(#gold)"/>
    <text x="246" y="81" fill="#c3d0d9" font-size="12">Live on Twitch</text>
    <circle class="dot" cx="237" cy="77" r="4" fill="#ff4d4d"/>
    <!-- Cadran -->
    <circle cx="372" cy="40" r="30" fill="none" stroke="#ffffff" stroke-opacity=".2" stroke-width="2"/>
    <line x1="372" y1="40" x2="372" y2="16" stroke="#ffd86e" stroke-width="3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-60 372 40;50 372 40;-60 372 40" dur="6s" repeatCount="indefinite"/>
    </line>
    <circle cx="372" cy="40" r="3" fill="#ffd86e"/>
  </g>
</svg>
