<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="t d">
  <title id="t">Let's work together</title>
  <desc id="d">Websites, interfaces and stream overlays. Get in touch on LinkedIn.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#009fe3" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#1b2230"/>
      <stop offset="1" stop-color="#11151c"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0077b6"/>
      <stop offset="1" stop-color="#009fe3"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
          </style>
  </defs>

  <rect width="1200" height="200" rx="18" fill="#11151c"/>
  <rect x=".5" y=".5" width="1199" height="199" rx="17.5" fill="url(#bg)" stroke="#323a5c"/>
  <clipPath id="card"><rect width="1200" height="200" rx="18"/></clipPath>
  <g clip-path="url(#card)">
