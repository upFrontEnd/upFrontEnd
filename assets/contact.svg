    <rect y="100" width="6" height="100" fill="#b55b16"/>
  </g>

  <text x="48" y="80" fill="#ffffff" font-size="34" font-weight="700">Let's build something together.</text>
  <text x="48" y="118" fill="#c3d0d9" font-size="18">Websites, interfaces, branding and stream overlays. Say hello on LinkedIn.</text>

